<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Pocket AI</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#007AFF">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

<section id="home" class="page active">
<h1>Pocket AI</h1>
<p class="sub">个人财务助手</p>

<div class="card hero">
<p>本月剩余</p>
<h2 id="balance">¥0</h2>
<div class="grid">
<div>收入<strong id="income">¥0</strong></div>
<div>支出<strong id="expense">¥0</strong></div>
<div>储蓄率<strong id="saving">0%</strong></div>
</div>
</div>

<div class="card">
<h3>预算</h3>
<p id="budgetText">本月预算 ¥10000</p>
<div class="bar"><div id="bar"></div></div>
</div>

<div class="card">
<h3>AI分析</h3>
<p id="aiText">开始记录消费，Pocket AI 会分析你的习惯。</p>
</div>

<button class="plus" onclick="show('add')">＋</button>
</section>


<section id="add" class="page">
<h1>新增记录</h1>
<input id="amount" type="number" placeholder="金额">
<div class="row">
<button onclick="setType('expense')">支出</button>
<button onclick="setType('income')">收入</button>
</div>

<select id="category">
<option>🍜 餐饮</option>
<option>🚗 交通</option>
<option>🛒 购物</option>
<option>☕ 咖啡</option>
<option>🏠 住房</option>
<option>🎮 娱乐</option>
<option>📚 学习</option>
<option>📦 其他</option>
</select>

<input id="note" placeholder="备注">
<button onclick="save()">保存</button>
</section>


<section id="bill" class="page">
<h1>账单</h1>
<div id="records"></div>
</section>


<section id="analysis" class="page">
<h1>分析</h1>
<div class="card center">
<h2 id="score">--</h2>
<p>财务健康评分</p>
</div>
<div class="card">
<h3>消费分类</h3>
<p id="categoryReport"></p>
</div>
</section>


<section id="mine" class="page">
<h1>我的</h1>
<div class="card">
<h3>月预算</h3>
<input id="budgetInput" type="number" placeholder="10000">
<button onclick="saveBudget()">保存</button>
</div>
<div class="card">
<button onclick="exportData()">导出数据</button>
</div>
</section>


<nav>
<button onclick="show('home')">首页</button>
<button onclick="show('bill')">账单</button>
<button onclick="show('analysis')">分析</button>
<button onclick="show('mine')">我的</button>
</nav>

</div>
<script src="app.js"></script>
</body>
</html>
