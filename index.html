<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pocket AI</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#007AFF">
<style>
body{margin:0;background:#f8f8fa;font-family:-apple-system,BlinkMacSystemFont,Arial;color:#111}
.app{max-width:430px;margin:auto;padding:25px 20px 90px}
.card{background:#fff;border-radius:24px;padding:22px;margin:18px 0}
.money{font-size:42px;font-weight:700}
button,input,select{width:100%;height:50px;border:0;border-radius:16px;margin:8px 0;font-size:16px}
button{background:#007AFF;color:#fff}
.page{display:none}.active{display:block}
.nav{position:fixed;bottom:0;width:100%;max-width:430px;background:#fff;display:flex;justify-content:space-around}
.nav button{background:none;color:#111;width:auto}
.record{background:#fff;border-radius:16px;padding:15px;margin:10px 0;display:flex;justify-content:space-between}
</style>
</head>
<body>
<div class="app">
<div id="home" class="page active"><h1>💙 Pocket AI</h1><div class="card">本月余额<div class="money" id="bal">¥0</div><p>收入 <span id="inc">0</span>　支出 <span id="exp">0</span></p></div><div class="card"><b>AI提醒</b><p id="msg">开始记录消费。</p></div><button onclick="show('add')">＋ 记一笔</button></div>
<div id="add" class="page"><h1>新增记录</h1><input id="amt" type="number" placeholder="金额"><select id="typ"><option value="expense">支出</option><option value="income">收入</option></select><select id="cat"><option>餐饮</option><option>交通</option><option>购物</option><option>其他</option></select><input id="note" placeholder="备注"><button onclick="save()">保存</button></div>
<div id="bill" class="page"><h1>账单</h1><div id="list"></div></div>
<div id="analysis" class="page"><h1>AI分析</h1><div class="card"><h2 id="score">--</h2><p id="report"></p></div></div>
<div class="nav"><button onclick="show('home')">首页</button><button onclick="show('bill')">账单</button><button onclick="show('analysis')">分析</button></div>
</div>
<script>
let d=JSON.parse(localStorage.getItem('pocket')||'[]');
function show(x){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(x).classList.add('active');up()}
function save(){d.unshift({a:+amt.value,t:typ.value,c:cat.value});localStorage.setItem('pocket',JSON.stringify(d));show('bill')}
function up(){let i=0,e=0;list.innerHTML='';d.forEach(x=>{x.t==='income'?i+=x.a:e+=x.a;list.innerHTML+=`<div class="record">${x.c}<span>${x.t==='income'?'+':'-'}¥${x.a}</span></div>`});inc.innerText=i;exp.innerText=e;bal.innerText='¥'+(i-e);msg.innerText=e>i?'注意控制支出。':'消费状态良好。';score.innerText=e>i?60:85;report.innerText=msg.innerText}
up();
if('serviceWorker'in navigator)navigator.serviceWorker.register('service-worker.js');
</script>
</body></html>
