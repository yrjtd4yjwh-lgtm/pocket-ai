<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Pocket AI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
<section id="home" class="page active">
<h1>Pocket AI</h1>
<p class="subtitle">个人消费管理助手</p>
<div class="card">
<p>本月剩余</p>
<h2 id="balance">¥0</h2>
<p>预算使用 <span id="budgetUsed">0%</span></p>
<div class="progress"><div id="progressBar"></div></div>
<div class="summary">
<div>收入<strong id="income">¥0</strong></div>
<div>支出<strong id="expense">¥0</strong></div>
<div>储蓄率<strong id="saving">0%</strong></div>
</div>
</div>
<div class="card"><h3>AI提醒</h3><p id="aiText">记录第一笔消费后开始分析。</p></div>
<button class="add" onclick="showPage('add')">＋</button>
</section>

<section id="add" class="page">
<h1>新增记录</h1>
<input id="amount" type="number" placeholder="金额">
<div class="switch">
<button onclick="setType('expense')">支出</button>
<button onclick="setType('income')">收入</button>
</div>
<select id="category">
<option>🍜 餐饮</option><option>🚗 交通</option><option>🛒 购物</option><option>☕ 咖啡</option>
<option>🏠 住房</option><option>🎮 娱乐</option><option>📚 学习</option><option>📦 其他</option>
</select>
<input id="note" placeholder="备注">
<button class="save" onclick="saveRecord()">保存</button>
</section>

<section id="bill" class="page">
<h1>账单</h1>
<div id="records">暂无记录</div>
</section>

<section id="analysis" class="page">
<h1>AI分析</h1>
<div class="card center"><h2 id="score">--</h2><p>财务健康评分</p></div>
<div class="card"><h3>消费分类</h3><div id="categoryReport"></div></div>
<div class="card"><h3>AI建议</h3><p id="report"></p></div>
</section>

<section id="mine" class="page">
<h1>我的</h1>
<div class="card">
<h3>每月预算</h3>
<input id="budgetInput" type="number" placeholder="例如10000">
<button class="save" onclick="saveBudget()">保存预算</button>
</div>
<div class="card">数据仅保存在本机 🔒</div>
</section>

<nav>
<button onclick="showPage('home')">首页</button>
<button onclick="showPage('bill')">账单</button>
<button onclick="showPage('analysis')">分析</button>
<button onclick="showPage('mine')">我的</button>
</nav>
</div>
<script src="app.js"></script>
</body>
</html>
