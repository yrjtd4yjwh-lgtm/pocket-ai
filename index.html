
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>宋芷汀会赚很多钱</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>

<body>
<div class="app">

<section id="home" class="page active">
<h1>宋芷汀会赚很多钱</h1>
<p class="sub">个人财务助手</p>

<div class="card">
<p>本月结余</p>
<div class="big" id="balance">¥0</div>

<div class="grid">
<div>收入<strong id="income">¥0</strong></div>
<div>支出<strong id="expense">¥0</strong></div>
<div>结余<strong id="remain">¥0</strong></div>
</div>
</div>

<div class="card">
<h3>AI提醒</h3>
<p id="tip">记录消费后自动分析。</p>
</div>

<button onclick="show('add')">＋ 记一笔</button>
</section>


<section id="add" class="page">
<h1>记一笔</h1>

<input id="amount" type="number" placeholder="金额">

<select id="type" onchange="changeCategory()">
<option value="expense">支出</option>
<option value="income">收入</option>
</select>

<select id="category"></select>

<input id="note" placeholder="备注">

<button onclick="save()">保存</button>
</section>


<section id="bill" class="page">
<h1>账单</h1>

<input id="search" placeholder="搜索消费" oninput="refresh()">

<div id="records"></div>
</section>


<section id="analysis" class="page">
<h1>分析</h1>

<div class="card">
<h3>本月消费排行</h3>
<div id="rank"></div>
</div>

</section>


<section id="mine" class="page">
<h1>我的</h1>

<div class="card">
<p>数据安全</p>
<p>Pocket AI V2.4 Stable</p>
<button onclick="backup()">导出数据</button>
</div>
</section>


<nav>
<button onclick="show('home')">首页</button>
<button onclick="show('bill')">账单</button>
<button onclick="show('analysis')">分析</button>
<button onclick="show('mine')">我的</button>
</nav>

</div>

<script src="app.js"></script>
</body>
</html>
